<h3 class="mt-4">{{ !isEditMode ? 'Create New Card' : 'Update Card'}}</h3>
<div class="row mb-4">
    <div class="col-md-6 mb-3">
        <label for="title">Title</label>
        <input type="text" class="form-control" placeholder="Enter Title" #title>
    </div>

    <div class="col-md-6 mb-3">
        <label for="description">Description</label>
        <input type="text" class="form-control" placeholder="Enter Description" #description>
    </div>

    <div class="col-md-6 mb-3">
        <label for="imageURL">Image URL</label>
        <input type="text" class="form-control" placeholder="Enter Image URL" #image>
    </div>

    <div class="col-md-6 mb-3">
        <label for="category">Category</label>
        <input type="text" class="form-control" placeholder="Enter Category" #category>
    </div>

    <div class="col-md-6 mb-3">
        <label for="price">Price</label>
        <input type="number" class="form-control" placeholder="Enter Price" #price>
    </div>

    <div class="col-md-6 mb-3">
        <label for="rating">Rating</label>
        <input type="number" class="form-control" placeholder="Enter Rating" min="1" max="5" step="0.1" #rating>
    </div>
    <div class="col-md-6 mb-3">
        <label for="rating">Is Active</label>
        <select class="form-control" #isActive>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
    </div>
    <div class="col-md-12 mb-3">
        <button *ngIf="!isEditMode" class="btn btn-primary" (click)="onAddCard()">
            Add Card
        </button>
        <button *ngIf="isEditMode" class="btn btn-primary" (click)="onUpdateCard()">
            Update Card
        </button>
    </div>

</div>




<div class="row">

    <div class="col-md-4 mb-4" *ngFor="let card of cards">

        <div class="card h-100 shadow-sm">

            <!-- Card Header -->
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>{{ card.title }}</strong>

                <span class="badge text-white" [ngClass]="{
              'bg-success': card.rating > 4,
              'bg-warning': card.rating <= 4
            }">
                    ⭐ {{ card.rating }}
                </span>
            </div>

            <!-- Card Image -->
            <img [src]="card.image" class="card-img-top" height="180" alt="Course Image">

            <!-- Card Body -->
            <div class="card-body">

                <h5 class="card-title">{{ card.title }}</h5>

                <p class="card-text">
                    {{ card.description }}
                </p>

                <p>
                    <strong>Category:</strong>
                    {{ card.category }}
                </p>

                <p>
                    <strong>Price:</strong>
                    ₹{{ card.price }}
                </p>

                <p>
                    <strong>Status:</strong>
                    <span [ngClass]="card.isActive ? 'text-success' : 'text-danger'">
                        {{ card.isActive ? 'Active' : 'Inactive' }}
                    </span>
                </p>

            </div>

            <!-- Card Footer -->
            <div class="card-footer d-flex justify-content-between">
                <button class=" mr-2" mat-mini-fab color="primary" aria-label="Example icon button with a menu icon" (click)="onEdit(card)">
                    <mat-icon>edit</mat-icon>
                </button> 
                <button class=" mr-2" mat-mini-fab color="warn" aria-label="Example icon button with a menu icon" [disabled]="isEditId === card.id" (click)="onDelete(card.id)">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>

        </div>

    </div>
</div>
