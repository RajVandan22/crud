<div class="row">
    <div class="col-md-4 mb-4 mb-md-0">
        <h3>{{isEditMode ? 'Update Todo' : 'Add Todo'}}</h3>
        <div class="form-group">
            <label for="toItem">TodoItem</label>
            <input type="text" class="form-control" #toItemRef>
        </div>
        <div class="form-group">
            <label for="isCompleted">IsCompleted</label>
            <select class="form-control" #isCompletedRef>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
        </div>
        <button *ngIf="!isEditMode" class="w-100" mat-raised-button color="primary" (click)="onAddtodo()">Add
            Todo</button>
        <button *ngIf="isEditMode" class="w-100" mat-raised-button color="primary" (click)="onUpdatetodo()">Update Todo</button>
    </div>
    <div class="col-md-8">
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let todo of todoArr">
                <strong>
                    <input type="checkbox" [checked]="todo.isCompleted" (click)="onchange(todo)">
                    {{todo.todoItem}}
                    <span class="badge" [ngClass]="todo.isCompleted ? 'bg-success' : 'bg-danger'">

                        {{ todo.isCompleted ? 'Completed' : 'Incomplete' }}

                    </span>

                </strong>
                <div>
                    <button class=" mr-2" mat-mini-fab color="primary"
                        aria-label="Example icon button with a menu icon" (click)="onEdit(todo)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-mini-fab color="warn" aria-label="Example icon button with a menu icon" [disabled] = "isEditId === todo.todoId" (click)="onRemove(todo.todoId)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </li>
        </ul>
    </div>
</div>
